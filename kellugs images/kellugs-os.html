<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kellugs OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6C4CF5;
  --purple-dark:#5636D8;
  --purple-light:#EDE9FE;
  --ink:#111114;
  --ink-soft:#26262b;
  --gray-900:#18181b;
  --gray-700:#52525b;
  --gray-500:#8b8b93;
  --gray-300:#e4e4e9;
  --gray-100:#f2f2f5;
  --white:#ffffff;
  --green-bg:#dcfce7; --green-fg:#15803d; --green-dot:#22c55e;
  --amber-bg:#fef3c7; --amber-fg:#b45309; --amber-dot:#f59e0b;
  --red-bg:#fde4e4;   --red-fg:#dc2626;   --red-dot:#ef4444;
  --pink-bg:#fce7f0;  --pink-fg:#db2777;  --pink-dot:#ec4899;
  --blue-bg:#dbeafe;  --blue-fg:#2563eb;  --blue-dot:#3b82f6;
  --gray-bg:#eceef1;  --gray-fg:#52525b;  --gray-dot:#9ca3af;
  --bg:var(--gray-100);
  --card:var(--white);
  --border:var(--gray-300);
  --text:var(--ink);
  --text-sub:var(--gray-700);
  --text-mute:var(--gray-500);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0e0e11; --card:#1a1a1f; --border:#2b2b33; --text:#f2f2f5; --text-sub:#c9c9d2; --text-mute:#8b8b93; --gray-100:#141418; --purple-light:#241f3d;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e11; --card:#1a1a1f; --border:#2b2b33; --text:#f2f2f5; --text-sub:#c9c9d2; --text-mute:#8b8b93; --gray-100:#141418; --purple-light:#241f3d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:8px;}

/* fixed left brand-edge gradient sliver */
.edge-gradient{
  position:fixed; left:0; top:0; bottom:0; width:14px;
  background:linear-gradient(180deg,#8b6cf7 0%, #6C4CF5 25%, rgba(108,76,245,0) 75%);
  z-index:0; pointer-events:none;
}

/* ---------- shell layout ---------- */
.app{display:flex; min-height:100%; position:relative; z-index:1;}
.sidebar{
  width:230px; flex:0 0 230px; background:var(--ink); color:#e7e7ea;
  margin:14px 0 14px 20px; border-radius:20px; padding:22px 16px;
  display:flex; flex-direction:column; height:calc(100vh - 28px); position:sticky; top:14px;
  transition:transform .25s ease;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px 8px; font-weight:800; font-size:19px; color:#fff;}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
.nav-section-label{font-size:11px; letter-spacing:.02em; color:#7b7b84; padding:14px 10px 6px;}
.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:11px;
  color:#b6b6bd; font-size:14.5px; font-weight:500; position:relative;
}
.nav-item svg{flex:0 0 auto;opacity:.85;}
.nav-item .label{flex:1;}
.nav-item .badge{
  background:#2d2d34; color:#d6d6db; font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:20px;
}
.nav-item .lock{opacity:.55;}
.nav-item:hover{background:#1e1e23; color:#e7e7ea;}
.nav-item.active{background:#232329; color:#fff; font-weight:700;}
.nav-item.active .badge{background:var(--purple); color:#fff;}
.nav-divider{height:1px; background:#28282e; margin:14px 4px;}
.sidebar-footer{margin-top:auto; padding:12px 8px 2px; border-top:1px solid #26262c;}
.sidebar-footer .loc{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#dcdce0;margin-bottom:3px;}
.sidebar-footer .phase{font-size:12px;color:#7b7b84;}

.main{flex:1; min-width:0; padding:22px 26px 60px;}
.topbar{display:flex; align-items:center; gap:14px; margin-bottom:22px;}
.crumb{font-size:15px; color:var(--text-sub); font-weight:500; white-space:nowrap;}
.search{
  flex:1; max-width:460px; display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); border-radius:12px; padding:9px 12px; color:var(--text-mute); font-size:14px;
}
.search input{border:none;background:transparent;outline:none;flex:1;color:var(--text);font-size:14px;}
.search kbd{background:var(--gray-100); border-radius:5px; font-size:11px; padding:2px 6px; color:var(--text-mute); font-weight:600;}
.top-icon-btn{
  width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;color:var(--text-sub);
}
.top-icon-btn .dot{position:absolute; top:7px; right:8px; width:8px;height:8px;border-radius:50%;background:var(--red-dot); border:2px solid var(--card);}
.user-chip{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:6px 12px 6px 6px; cursor:pointer; position:relative; flex:0 0 auto;
}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12.5px;flex:0 0 auto;}
.user-chip .name{font-size:13.5px; font-weight:700; line-height:1.2;}
.user-chip .role{font-size:11.5px; color:var(--text-mute); line-height:1.2;}
.chev{color:var(--text-mute); margin-left:2px;}
.dropdown{
  position:absolute; top:calc(100% + 8px); right:0; width:240px; background:var(--card);
  border:1px solid var(--border); border-radius:14px; box-shadow:0 16px 40px rgba(0,0,0,.16); padding:10px;
  display:none; z-index:40;
}
.dropdown.open{display:block;}
.dropdown .who{padding:8px 8px 12px; border-bottom:1px solid var(--border); margin-bottom:6px;}
.dropdown .who .n{font-weight:700;font-size:14px;}
.dropdown .who .r{font-size:12px;color:var(--text-mute);}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;font-size:14px;color:var(--text);}
.dropdown-item:hover{background:var(--gray-100);}
.dropdown-item .tag{margin-left:auto;font-size:11.5px;color:var(--text-mute);}
.dropdown-item.danger{color:#dc2626;}
.bell-panel{position:absolute; top:calc(100% + 8px); right:0; width:290px; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 16px 40px rgba(0,0,0,.16); padding:12px; display:none; z-index:40;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:2px 4px 8px;font-size:13px;}
.bell-item{padding:8px 4px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-sub);}
.bell-item:last-child{border-bottom:none;}
.bell-item b{color:var(--text);}

/* page head */
.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h1{font-size:32px; margin:0 0 6px; font-weight:800; letter-spacing:-.01em;}
.page-head .sub{color:var(--text-mute); font-size:14.5px;}
.head-actions{display:flex; gap:10px; align-items:center;}
.btn{border-radius:11px; padding:10px 16px; font-size:14px; font-weight:600; border:1px solid transparent; display:inline-flex; align-items:center; gap:8px; white-space:nowrap;}
.btn-outline{background:var(--card); border-color:var(--border); color:var(--text);}
.btn-outline:hover{background:var(--gray-100);}
.btn-dark{background:var(--ink); color:#fff;}
.btn-dark:hover{background:var(--ink-soft);}
.btn-dark:disabled{background:var(--gray-500); cursor:default;}
.dd-btn{background:var(--card); border:1px solid var(--border); border-radius:11px; padding:10px 14px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; position:relative;}

/* banners */
.banner{display:flex; gap:10px; align-items:flex-start; border-radius:13px; padding:13px 16px; font-size:13.8px; margin-bottom:14px; border:1px solid var(--border); background:var(--card); color:var(--text-sub);}
.banner b{color:var(--text);}
.banner.info{border-color:#c9beff; background:var(--purple-light); color:#3f2f8f;}
.banner.info b{color:#2f2270;}
.banner a{color:var(--purple); font-weight:600; text-decoration:underline;}
.banner svg{flex:0 0 auto; margin-top:2px;}

/* cards */
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:18px;}
.grid2{display:grid; grid-template-columns:2fr 1fr; gap:16px; align-items:start;}
.card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px;}
.stat{display:flex; gap:14px; align-items:flex-start;}
.stat .ic{width:38px;height:38px;border-radius:11px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--text-sub);}
.stat .lbl{font-size:13.5px; color:var(--text-mute); margin-bottom:6px;}
.stat .val{font-size:24px; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.stat .sub{font-size:12.5px; color:var(--text-mute); margin-top:4px;}
.chip{font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:20px;}
.chip.green{background:var(--green-bg); color:var(--green-fg);}
.chip.amber{background:var(--amber-bg); color:var(--amber-fg);}
.chip.red{background:var(--red-bg); color:var(--red-fg);}
.chip.pink{background:var(--pink-bg); color:var(--pink-fg);}
.chip.blue{background:var(--blue-bg); color:var(--blue-fg);}
.chip.gray{background:var(--gray-bg); color:var(--gray-fg);}

.section-title{font-size:19px; font-weight:800; margin:0 0 4px;}
.section-sub{font-size:13px; color:var(--text-mute); margin:0 0 16px;}

/* bar chart */
.bars{display:flex; align-items:flex-end; gap:22px; height:210px; margin-top:6px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; gap:8px;}
.bar-val{font-size:13px; font-weight:700; color:var(--text-sub);}
.bar-track{width:100%; max-width:64px; background:var(--gray-100); border-radius:8px 8px 4px 4px; flex:1; display:flex; align-items:flex-end;}
.bar-fill{width:100%; border-radius:8px 8px 4px 4px; background:linear-gradient(180deg,#8b6cf7,var(--purple));}
.bar-label{font-size:12.5px; color:var(--text-mute); margin-top:2px;}

/* line chart */
.linechart-wrap{margin-top:10px;}
.linechart-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--text-mute);margin-top:8px;}

/* donut */
.donut-wrap{display:flex; flex-direction:column; align-items:center; margin:8px 0 18px;}
.donut{width:180px;height:180px;border-radius:50%; display:flex;align-items:center;justify-content:center; position:relative;}
.donut .hole{width:132px;height:132px;border-radius:50%;background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.donut .hole .pct{font-size:28px; font-weight:800;}
.donut .hole .of{font-size:11.5px; color:var(--text-mute); text-align:center; max-width:110px;}

/* mini bars */
.minibars{display:flex; align-items:flex-end; gap:10px; height:90px; margin-top:14px;}
.mb-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
.mb-val{font-size:11.5px; font-weight:700; color:var(--text-mute);}
.mb-fill{width:100%; border-radius:6px 6px 3px 3px; background:var(--gray-300);}
.mb-fill.last{background:linear-gradient(180deg,#8b6cf7,var(--purple));}
.mb-label{font-size:11px; color:var(--text-mute);}

/* scorecards */
.grid2x2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px;}
.score-card .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
.score-card .owner{font-size:12.5px; color:var(--text-mute); margin-bottom:12px;}
.metric-row{margin-bottom:10px;}
.metric-row .mr-top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px;}
.mr-track{height:6px; border-radius:6px; background:var(--gray-100); overflow:hidden;}
.mr-fill{height:100%; border-radius:6px;}
.mr-fill.green{background:#16a34a;} .mr-fill.amber{background:#f59e0b;} .mr-fill.red{background:#ef4444;}

/* tables */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.8px;}
thead th{text-align:left; font-weight:600; color:var(--text-mute); font-size:12.5px; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody td{padding:13px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.flag{background:rgba(239,68,68,.06);}
.cell-main{font-weight:700;}
.cell-sub{font-size:12px; color:var(--text-mute); margin-top:2px; font-weight:400;}
.strike{text-decoration:line-through; text-decoration-color:var(--text-mute);}
.dotline{display:inline-flex;align-items:center;gap:6px;}
.dotline::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}

/* filter chips */
.chipbar{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
.fchip{padding:8px 14px; border-radius:20px; font-size:13.5px; font-weight:600; background:var(--gray-100); color:var(--text-sub); border:1px solid transparent;}
.fchip.active{background:var(--ink); color:#fff;}
.tbl-search{margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--gray-100); border-radius:11px; padding:8px 12px; font-size:13.5px; color:var(--text-mute); min-width:220px;}
.tbl-search input{background:transparent; border:none; outline:none; flex:1; color:var(--text); font-size:13.5px;}

/* list rows (facilities, hr, alerts, receivables-side etc) */
.list-row{display:flex; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.list-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.list-body{flex:1; min-width:0;}
.list-tag{font-size:11px; font-weight:800; letter-spacing:.02em; color:var(--purple);}
.list-title{font-size:14px; font-weight:600; margin-top:2px;}
.list-sub{font-size:12.5px; color:var(--text-mute); margin-top:3px;}
.list-status{display:flex; align-items:center; gap:8px; margin-top:2px;}

.kv-row{display:flex; justify-content:space-between; align-items:flex-start; padding:12px 2px; border-bottom:1px solid var(--border); font-size:13.8px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{font-weight:600;}
.kv-row .k-sub{font-size:12px;color:var(--text-mute); margin-top:2px; font-weight:400;}
.kv-row .v{font-weight:700; text-align:right;}

.pagination{display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:13px; color:var(--text-mute);}
.pg-btns{display:flex; gap:6px;}
.pg-btn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--gray-100); font-weight:600; font-size:13px; color:var(--text-sub);}
.pg-btn.active{background:var(--ink); color:#fff;}

.footnote{font-size:12.5px; color:var(--text-mute); margin-top:12px;}
.footnote.center{text-align:center;}

/* login / index page */
.index-wrap{max-width:1180px; margin:0 auto; padding:40px 26px 70px;}
.hero{background:var(--ink); border-radius:24px; padding:44px; display:flex; gap:40px; align-items:center; color:#fff; margin-bottom:34px; flex-wrap:wrap;}
.hero-left{flex:1; min-width:280px;}
.eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.03em; color:#a78bfa; margin-bottom:14px;}
.hero h1{font-size:40px; font-weight:800; line-height:1.12; margin:0 0 16px; letter-spacing:-0.01em;}
.hero p{color:#c6c6cf; font-size:15.5px; max-width:480px; margin:0 0 26px;}
.hero-stats{display:flex; gap:34px; padding-top:22px; border-top:1px solid #2c2c33;}
.hero-stats div b{font-size:24px; display:block; font-weight:800;}
.hero-stats div span{font-size:12.5px; color:#9c9ca6;}
.hero-right{flex:0 0 300px; background:#fff; border-radius:16px; padding:16px; color:#111;}
.door-illustration{border-radius:10px; overflow:hidden; background:linear-gradient(160deg,#3a2b6b,#1c1730);}
.door-caption{padding-top:12px; font-size:12.5px; color:#4b4b55;}
.door-caption b{color:#111; font-size:13.5px; display:block; margin-bottom:2px;}

.index-lower{display:grid; grid-template-columns:1fr 1.55fr; gap:24px; align-items:start;}
.login-card{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:30px;}
.login-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;margin-bottom:20px;}
.login-brand .mark{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;}
.login-brand .os{color:var(--purple);}
.login-card h2{font-size:24px; margin:0 0 8px; font-weight:800;}
.login-card p{color:var(--text-mute); font-size:13.8px; margin:0 0 22px; line-height:1.5;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;}
.field .inputwrap{position:relative;}
.field input{width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--border); background:var(--gray-100); font-size:14px; color:var(--text); outline:none;}
.field input:focus{border-color:var(--purple); background:var(--card);}
.showtoggle{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12.5px; font-weight:700; color:var(--purple); background:none; border:none;}
.remember{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-sub); margin-bottom:20px;}
.signin-btn{width:100%; background:var(--ink); color:#fff; border:none; border-radius:13px; padding:13px; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;}
.signin-btn:hover{background:var(--ink-soft);}
.proto-note{display:flex; gap:9px; margin-top:18px; font-size:12px; color:var(--text-mute); line-height:1.5; background:var(--gray-100); border-radius:11px; padding:12px;}
.proto-note code{background:var(--gray-300); padding:1px 5px; border-radius:5px; font-size:11.5px;}
.proto-note svg{flex:0 0 auto; margin-top:1px;}

.roles-head{margin-bottom:14px;}
.roles-head h3{font-size:19px; margin:0 0 4px; font-weight:800;}
.roles-head p{font-size:13.5px; color:var(--text-mute); margin:0;}
.roles-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.role-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; gap:12px; align-items:flex-start; text-align:left;}
.role-card:hover{border-color:var(--purple);}
.role-av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.role-body{flex:1; min-width:0;}
.role-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.role-name-row .rn{font-weight:700; font-size:14.5px;}
.role-tr-badge{font-size:10.5px; font-weight:800; color:var(--purple); background:var(--purple-light); padding:2px 7px; border-radius:20px;}
.role-person{font-size:12px; color:var(--text-mute); margin-top:1px;}
.role-blurb{font-size:13px; color:var(--text-sub); margin-top:8px; line-height:1.45;}
.role-tags{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.rtag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
.rtag.writes{background:var(--purple-light); color:var(--purple-dark);}
.rtag.reads{background:var(--gray-bg); color:var(--gray-fg);}
.roles-footnote{font-size:12.5px; color:var(--text-mute); margin-top:16px;}
.roles-footnote code{background:var(--gray-300); padding:1px 6px; border-radius:5px;}

/* toast */

/* ============================= HELPERS ============================= */
function chip(c){ return c ? `<span class="chip ${c.c}">${c.t}</span>` : ''; }
function pill(label,color){ return `<span class="chip ${color}"><span class="dotline">${label}</span></span>`; }

function statCard(s){
  return `<div class="card stat">
    <div class="ic">${ICONS[s.ic]}</div>
    <div style="flex:1;min-width:0;">
      <div class="lbl">${s.lbl}</div>
      <div class="val">${s.val} ${chip(s.chip)}</div>
      <div class="sub">${s.sub||''}</div>
    </div>
  </div>`;
}

function barChart(data,maxOverride){
  const max = maxOverride || Math.max(...data.map(d=>d.v));
  return `<div class="bars">${data.map(d=>{
    const h = Math.max(6, Math.round((d.v/max)*100));
    return `<div class="bar-col"><div class="bar-val">${typeof d.v==='number' && d.v<1000 && d.v>0 && !d.raw ? '' : ''}${d.disp||d.v}</div>
      <div class="bar-track"><div class="bar-fill" style="height:${h}%"></div></div>
      <div class="bar-label">${d.l}</div></div>`;
  }).join('')}</div>`;
}

function lineChart(cfg){
  const w=760,h=210,pad=6;
  const {points,min,max,target,months}=cfg;
  const range = max-min;
  const stepX = (w-pad*2)/(points.length-1);
  const y = v => h - pad - ((v-min)/range)*(h-pad*2);
  const pts = points.map((v,i)=>[pad+i*stepX, y(v)]);
  const pathD = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const ty = y(target);
  const lastPt = pts[pts.length-1];
  return `<div class="linechart-wrap">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible">
      <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6C4CF5" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#6C4CF5" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" y1="${ty.toFixed(1)}" x2="${w}" y2="${ty.toFixed(1)}" stroke="#e11d8a" stroke-width="1.5" stroke-dasharray="5 5"/>
      <path d="${areaD}" fill="url(#lg1)"/>
      <path d="${pathD}" fill="none" stroke="#6C4CF5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="5" fill="#fff" stroke="#6C4CF5" stroke-width="3"/>
      <text x="${w-4}" y="${ty-8}" text-anchor="end" font-size="12" fill="#db2777" font-weight="700">Target ₦${target.toFixed(1)}m</text>
    </svg>
    <div class="linechart-axis">${months.map(m=>`<span>${m}</span>`).join('')}</div>
  </div>`;
}

function donut(pct,label){
  const deg = Math.round((pct/100)*360);
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(var(--purple) 0deg ${deg}deg, var(--gray-100) ${deg}deg 360deg)">
      <div class="hole"><div class="pct">${pct}%</div><div class="of">${label}</div></div>
    </div>
  </div>`;
}

function miniBars(data){
  const max = Math.max(...data.map(d=>d.v));
  return `<div class="minibars">${data.map((d,i)=>{
    const h = Math.max(10, Math.round((d.v/max)*100));
    const isLast = i===data.length-1;
    return `<div class="mb-col"><div class="mb-val">${d.v}%</div><div class="mb-fill ${isLast?'last':''}" style="height:${h}%"></div><div class="mb-label">${d.l}</div></div>`;
  }).join('')}</div>`;
}

function metricRow(m){
  return `<div class="metric-row"><div class="mr-top"><span>${m.l}</span><b>${m.v}</b></div><div class="mr-track"><div class="mr-fill ${m.c}" style="width:${Math.min(100,m.pct)}%"></div></div></div>`;
}

function scoreCard(s){
  return `<div class="card score-card">
    <div class="top"><h3 style="margin:0;font-size:17px;font-weight:800;">${s.dept}</h3>${pill(s.status,s.color)}</div>
    <div class="owner">${s.owner}</div>
    ${s.metrics.map(metricRow).join('')}
  </div>`;
}

function toggleUserDD(e){ e.stopPropagation(); document.getElementById('userDD').classList.toggle('open'); document.getElementById('bellPanel').classList.remove('open'); }

document.addEventListener('click', ()=>{
  const dd = document.getElementById('userDD'); if(dd) dd.classList.remove('open');
  const bp = document.getElementById('bellPanel'); if(bp) bp.classList.remove('open');
});

function togglePw(){
  const p = document.getElementById('loginPass');
  if(p.type==='password'){ p.type='text'; } else { p.type='password'; }
}

function loginAs(roleId){
  const r = ROLES.find(x=>x.id===roleId) || ROLES[5];
  State.role = r; State.loggedIn = true;
  safeSet('kellugs_role', r.id); safeSet('kellugs_loggedin','1');
  location.hash = '#/dashboard';
}
function signOut(){
  State.loggedIn = false;
  safeSet('kellugs_loggedin','0');
  location.hash = '#/';
}

/* ============================= ROUTER ============================= */
const PAGES = {dashboard:renderDashboard, sales:renderSales, inventory:renderInventory, logistics:renderLogistics, admin:renderAdmin};

function rerender(){ route(); }
function rerenderKeepFocus(el){
  const id = el.id;
  const selStart = el.selectionStart, selEnd = el.selectionEnd;
  route();
  requestAnimationFrame(()=>{
    const again = document.activeElement;
  });
}

function route(){
  const hash = location.hash.replace('#/','') || '';
  const root = document.getElementById('root');
  if(!State.loggedIn || hash===''){
    root.innerHTML = renderIndex();
    return;
  }
  const id = PAGES[hash] ? hash : 'dashboard';
  const body = PAGES[id]();
  root.innerHTML = `<div class="app">${sidebarHTML(id)}<main class="main">${topbarHTML(id)}${body}</main></div>`;
  // restore focus to search inputs after re-render if user was typing
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', route);
route();
</script>
